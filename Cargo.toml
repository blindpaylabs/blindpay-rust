[package]
name = "blindpay"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Official Rust SDK for the BlindPay payments API."
license = "MIT"
repository = "https://github.com/blindpaylabs/blindpay-rust"
homepage = "https://www.blindpay.com"
documentation = "https://docs.rs/blindpay"
readme = "README.md"
# Tests and their shared spec fixtures (1.2 MB) stay out of the published crate.
exclude = ["tests/", ".api-sync/", ".github/"]
keywords = ["blindpay", "payments", "stablecoin", "api", "sdk"]
categories = ["api-bindings", "finance"]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
http = "1"
# Native Svix webhook verification (plan D20).
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Already in the tree via reqwest; used directly for retry sleeps (plan A5).
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
# tests/contract.rs parses src/ to check serde types against the spec.
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[package.metadata.docs.rs]
all-features = true
