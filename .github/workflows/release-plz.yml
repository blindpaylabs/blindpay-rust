name: release-plz

# Two jobs, as release-plz recommends. `release` publishes to crates.io and tags
# when Cargo.toml carries a version crates.io doesn't have. `release-pr` opens
# or updates the release PR from Conventional Commits. They are separate so a
# failed publish (today: the crates.io `blindpay` name and its token are
# outside this repo) no longer stops release PRs from being opened.
#
# Publishing uses crates.io trusted publishing (OIDC, `id-token: write`) when a
# crate owner has configured this repository on crates.io, and falls back to
# the CARGO_REGISTRY_TOKEN secret otherwise.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Publish to crates.io
    if: github.repository_owner == 'blindpaylabs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-pr:
    name: Open or update the release PR
    if: github.repository_owner == 'blindpaylabs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
