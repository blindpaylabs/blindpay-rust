name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Format, lint, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
      - name: Publish dry run (package + verify build, as the release does)
        # Runs on the clean checkout, before anything writes into the tree.
        run: cargo publish --dry-run --locked
      - name: Package contents (no tests or fixtures)
        run: |
          cargo package --list --allow-dirty > package.txt
          cat package.txt
          if grep -E '^(tests/|\.api-sync/)' package.txt; then
            echo "::error::the published crate must not ship tests or fixtures"
            exit 1
          fi

  contract:
    # The Rust counterpart of the other SDKs' api-sync check: serde types vs
    # the committed spec snapshot, every fixture variant, and coverage of all
    # surface ops. A full api-sync apply for Rust is a follow-up.
    name: Spec contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Contract (Directions A/B/C)
        run: cargo test --all-features --test contract -- --nocapture
      - name: Error codes match the spec's error table
        run: cargo test --all-features --test error_codes
      - name: Spec fixtures decode (all 94 ops)
        run: cargo test --all-features --test fixtures_decode --test new_ops --test webhooks

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: Check (default features)
        run: cargo check --all-features --locked
      - name: Check (native-tls)
        run: cargo check --no-default-features --features native-tls --locked
      - name: Test build (dev-dependencies must build on the MSRV too)
        run: cargo test --all-features --locked --no-run

  native-tls:
    name: native-tls build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build without rustls
        run: cargo build --no-default-features --features native-tls
      - name: No TLS feature is a compile error
        run: |
          if cargo check --no-default-features 2> no-tls.log; then
            echo "::error::building without a TLS feature must fail"
            exit 1
          fi
          grep -q "needs a TLS backend" no-tls.log
